name: ${COMPOSE_STACK_NAME}

services:
  wordpress:
    image: ${WORDPRESS_IMAGE}
    container_name: ${COMPOSE_STACK_NAME}_wordpress
    volumes:
      - ./app:/var/www/html
      - ./compose-settings/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    ports:
      - ${WORDPRESS_HOST_PORT}:80
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${COMPOSE_STACK_NAME}_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./compose-settings/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: ${PMA_IMAGE}
    container_name: ${COMPOSE_STACK_NAME}_phpmyadmin
    restart: always
    ports:
      - ${PMA_HOST_PORT}:80
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

volumes:
  mysql_data:
    name: ${DB_VOLUME_NAME}

networks:
  default:
    name: ${COMPOSE_STACK_NAME}_network
